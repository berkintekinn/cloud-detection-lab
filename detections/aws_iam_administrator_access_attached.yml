title: AWS IAM AdministratorAccess Policy Attached to User
id: 0fdc92b3-287a-4f4c-b1aa-a3b540578280
status: test
description: Detects a successful AttachUserPolicy call granting the AWS-managed AdministratorAccess policy to an IAM user.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.persistence.iam-create-admin-user/
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_AttachUserPolicy.html
author: Cloud Detection Lab
date: 2026-11-03
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.003
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName: AttachUserPolicy
    requestParameters.policyArn: arn:aws:iam::aws:policy/AdministratorAccess
  filter_error:
    errorCode|exists: true
  condition: selection and not filter_error
fields:
  - eventTime
  - eventID
  - userIdentity.arn
  - sourceIPAddress
  - requestParameters.userName
  - requestParameters.policyArn
falsepositives:
  - Approved user provisioning or break-glass access during a documented change window.
level: high
