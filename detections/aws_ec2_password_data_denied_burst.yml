title: AWS EC2 GetPasswordData Denied Event
name: aws_ec2_password_data_denied_base
id: d5c4118f-3161-4eb9-ab71-5fe4c199a5b7
status: test
description: Base selector for denied GetPasswordData API calls; emitted only through the correlation rule below.
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: ec2.amazonaws.com
    eventName: GetPasswordData
    errorCode: Client.UnauthorizedOperation
  condition: selection
---
title: AWS EC2 Password Data Retrieval Denied Burst
id: 04d709cf-d8d3-4b43-92bb-d615265bc988
status: test
description: Detects five or more denied GetPasswordData calls by the same principal within five minutes.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.credential-access.ec2-get-password-data/
  - https://sigmahq.io/docs/meta/correlations.html
author: Cloud Detection Lab
date: 2026-11-03
tags:
  - attack.credential-access
  - attack.t1552
correlation:
  type: event_count
  rules:
    - aws_ec2_password_data_denied_base
  group-by:
    - userIdentity.arn
  timespan: 5m
  condition:
    gte: 5
falsepositives:
  - Repeated troubleshooting of Windows EC2 access by an unauthorized automation role.
level: medium
